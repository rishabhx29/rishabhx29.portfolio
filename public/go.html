<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Opening…</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background: #0b0b0f; color: #fafafa;
    font: 15px/1.7 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card { text-align: center; padding: 2rem 2.5rem; max-width: 34rem; }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 1.1rem; border-radius: 50%;
    border: 2px solid rgba(129, 140, 248, .25); border-top-color: #818cf8;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  a { color: #818cf8; }
  p { margin: .4rem 0; }
  .muted { color: #a1a1aa; font-size: 13px; }
  .btn {
    display: inline-block; margin-top: .6rem; padding: .6rem 1.1rem;
    border: 1px solid #818cf8; border-radius: 8px; color: #818cf8;
    text-decoration: none; font-weight: 600;
  }
  .btn:hover { background: rgba(129, 140, 248, .12); }
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="spinner"></div>
  <p id="status">Opening in a new tab…</p>
  <p><a class="btn" id="fallback" href="https://www.rishabhx29.me/" target="_blank" rel="noopener">Open the link</a></p>
  <p class="muted">This page closes itself once the link is open.</p>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var target = params.get("u");
  var status = document.getElementById("status");
  var fallback = document.getElementById("fallback");
  var spinner = document.getElementById("spinner");

  if (!target) {
    spinner.style.display = "none";
    status.textContent = "No destination given.";
    return;
  }

  // Only web addresses are allowed through, never a script or file scheme.
  var allowed = false;
  try {
    var probe = document.createElement("a");
    probe.href = target;
    allowed = probe.protocol === "http:" || probe.protocol === "https:";
  } catch (err) {
    allowed = false;
  }

  if (!allowed) {
    spinner.style.display = "none";
    status.textContent = "That destination is not allowed.";
    return;
  }

  fallback.href = target;

  // Try the new tab first. Some browsers block this, because the click that
  // brought the reader here is no longer a user gesture by now.
  var opened = null;
  try {
    opened = window.open(target, "_blank");
  } catch (err) {
    opened = null;
  }

  if (opened) {
    try { opened.opener = null; } catch (err) { /* ignore */ }
    // The destination is open in its own tab. Return the reader to the
    // profile so it stays on screen.
    window.setTimeout(function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        spinner.style.display = "none";
        status.textContent = "Opened in a new tab.";
      }
    }, 700);
  } else {
    // Blocked, so carry on in this tab rather than stranding the reader.
    spinner.style.display = "none";
    status.textContent = "Opening…";
    window.location.replace(target);
  }
})();
</script>
</body>
</html>
